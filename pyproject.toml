[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", ".venv", "coverage"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
files = ["api", "legora", "eval", "scripts", "LegalRag/citation_check.py", "retrieval/lexical.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
